#=======================================#
# Basics
#=======================================#
baseURL: https://pigsty.cc/
title: PIGSTY
locale: zh-CN
defaultContentLanguage: zh-cn
enableRobotsTXT: true
enableGitInfo: true
rssLimit: 200
# 标签等列表页标题保留作者原始大小写（不要把 pg_duckdb 渲染成 Pg_duckdb）。
capitalizeListTitles: false

#=======================================#
# Hugo Module (OINK, pinned for reproducible production builds)
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.168.0"
  imports:
    - path: github.com/pgsty/oink
      disable: false
  # Keep the site's own component data authoritative alongside the theme.
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: static
      target: static

