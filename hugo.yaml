#=======================================#
# Basics
#=======================================#
baseURL: https://pigsty.cc/
title: PIGSTY
locale: zh-CN
defaultContentLanguage: zh-cn
enableRobotsTXT: true
enableGitInfo: true
rssLimit: 200
# 标签等列表页标题保留作者原始大小写（不要把 pg_duckdb 渲染成 Pg_duckdb）。
capitalizeListTitles: false

#=======================================#
# Hugo Module (OINK, pinned for reproducible production builds)
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
      disable: false
  # Keep the site's own component data authoritative alongside the theme.
  mounts:
    - source: content
      target: content
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: static
      target: static

#=======================================#
# Menu Customization
#=======================================#
menus:
  main:
    - identifier: docs
      name: 文档
      weight: 10
      pageRef: /docs
      params:
        columns: 2
    - identifier: docs-setup
      parent: docs
      name: 快速上手
      pageRef: /docs/setup
      weight: 10
      params:
        icon: fa-solid fa-rocket
        description: 从一台 Linux 主机开始安装 Pigsty
    - identifier: docs-deploy
      parent: docs
      name: 生产部署
      pageRef: /docs/deploy
      weight: 20
      params:
        icon: fa-solid fa-server
        description: 规划并交付多节点高可用数据库服务
    - identifier: docs-pgsql
      parent: docs
      name: PostgreSQL
      pageRef: /docs/pgsql
      weight: 30
      params:
        icon: fa-solid fa-database
        description: 集群、服务、备份、监控与日常管理
    - identifier: docs-components
      parent: docs
      name: 组件手册
      pageRef: /docs/pig
      weight: 40
      params:
        icon: fa-solid fa-toolbox
        description: Pig、Patroni、PgBouncer、PgBackRest 等组件

    - identifier: ext
      name: 扩展
      weight: 20
      pageRef: /ext
      params:
        columns: 2
    - identifier: ext-list
      parent: ext
      name: 扩展目录
      pageRef: /ext/list
      weight: 10
      params:
        icon: fa-solid fa-puzzle-piece
        description: 浏览 575 个已打包 PostgreSQL 扩展
    - identifier: ext-os
      parent: ext
      name: 系统支持
      pageRef: /ext/os
      weight: 20
      params:
        icon: fa-brands fa-linux
        description: 查看操作系统与 PostgreSQL 版本兼容矩阵
    - identifier: ext-repo
      parent: ext
      name: 软件仓库
      pageRef: /docs/repo
      weight: 30
      params:
        icon: fa-solid fa-box-archive
        description: 配置 Pigsty 软件源并安装扩展包

    - identifier: blog
      name: 博客
      pageRef: /blog
      weight: 30
    - identifier: price
      name: 服务
      pageRef: /price
      weight: 40

#=======================================#
# Taxonomies Support
#=======================================#
taxonomies:
  module: module          # Pigsty INFRA NODE ETCD PGSQL REDIS MINIO DOCKER APP
  categories: categories  # Overview Concept Arch Config Param Playbook Admin Monitor Dashboard FAQ
  tags: tags              # misc

#=======================================#
# Blog Setting
#=======================================#
permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# External Services, Google Analytics
#=======================================#
services:
  googleAnalytics:
    id: "G-LG1V9WTKGE"

#=======================================#
# Image processing configuration
#=======================================#
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

#=======================================#
# Markdown Configuration
#=======================================#
markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    # OINK enhanced code blocks use class-based Chroma palettes.
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
# `make dev` selects this segment to keep the interactive HTML and its Markdown
# source links while skipping the expensive deployment-only outputs. Normal
# builds and `make view` do not select a segment.
segments:
  dev:
    includes:
      - output: '{html,markdown}'

outputs:
  home:
    - HTML
    - RSS
    #- JSON
    - markdown
    - LLMS
  page:
    - HTML
    - markdown
  section:
    - HTML
    - RSS
    #- print
    - markdown

# Keep ext HTML-only; large catalog outputs can exceed hosting limits.
cascade:
  - target:
      path: '{/ext,/ext/**}'
    outputs:
      - HTML

#=======================================#
# Site Params
#=======================================#
params:
  # metadata
  description: 'Pigsty 是开源免费的 PostgreSQL 数据库发行版，提供本地优先的 RDS，以及开箱即用的监控、管控、IaC、高可用，以及 PG 生态的 575 款插件与 12 款内核'
  version: v4.5.0           # 当前源码/文档基线；v4.5.0 正式发布前不等同于公开稳定版
  version_short: v4.5       # 当前源码/文档基线的短版本号（major.minor）
  stable_version: v4.4.0    # 当前公开稳定版；安装与 Git tag 示例使用此参数
  stable_version_short: v4.4
  pg_version: '18.6'        # PostgreSQL 最新小版本，正文用 {{< param pg_version >}}
  pig_version: 1.7.0        # PIG 最新版本号，PIG 文档正文用 {{< param pig_version >}}
  pigsty_version: 4.5.0     # PIG 内置的 Pigsty 版本，PIG 文档正文用 {{< param pigsty_version >}}
  pgext_count: 576          # Pigsty 在线已打包 PG 扩展数量，模板用 .Site.Params.pgext_count，正文用 {{< param pgext_count >}}
  pgext_url: https://pgext.cloud  # PG 扩展目录站点，首页扩展索引格点与指标卡片链接前缀
  github_stars: '5.5 K'      # GitHub Star 数（约数），正文兼容参数
  copyright:
    authors: Ruohang Feng
    from_year: 2018
  privacy_policy: /docs/about/privacy

  # Time format
  time_format_blog: 2006年01月02日
  time_format_default: '2006-01-02'

  # Project info
  archived_version: false
  url_latest_version: 'https://pigsty.cc'
  github_repo: 'https://github.com/pgsty/pigsty.cc'
  github_project_repo: 'https://github.com/pgsty/pigsty'

  # Version dropdown menu
  version_menu: "版本"
  versions:
    - version: "Pigsty English Site"
      url: 'https://pigsty.io'
    - version: "Pigsty v3.7 文档"
      url: 'https://doc.pgsty.com/zh'
    - version: "Pigsty v3.4 文档"
      url: 'https://v34.pigsty.cc/zh'
    - version: "Pigsty v2.7 文档"
      url: 'https://v27.pigsty.cc'
    - version: "Pigsty v1.5 文档"
      url: 'https://v15.pigsty.cc/docs'

  # Taxonomy display settings
  taxonomy:
    cloud: [module, categories, tags]
    cloud_title: [模块, 分类, 标签]
    page_header: [模块, 分类, 标签]

  # OINK 文档壳层与 Book 正文宽度。
  page_width: normal
  reading_width: normal
  footer_center_info: '[浙ICP备15016890号-2](https://beian.miit.gov.cn/)'

  # OINK 本地搜索与增强代码块均不依赖远程运行时。
  offline_search: true
  offline_search_on_serve: false
  offline_search_index: summary
  offline_search_summary_length: 100
  offline_search_max_results: 12
  highlight_classes: true

  # UI settings
  ui:
    blog_index_size: 10
    breadcrumb: true
    navbar_logo: true
    navbar_enabled: true
    footer_style: fat
    landing_search: true
    section_index: cards
    lastmod_commit: subject
    github_stars: '5.5 K'
    alt_site:
      label: English
      url: https://pigsty.io
    typography: technical
    shell_types: [docs, blog, swagger]
    docs_section: docs
    blog_section: blog
    pager_types: [docs, blog]
    quick_links: [docs, ext, blog]
    sidebar_icon_policy: all
    sidebar_cache_limit: 500
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_menu_truncate: 2000
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    sidebar_expand_levels: 2
    dark_mode:
      enable: true
      show_menu: true
    scroll_spy: false
    image_zoom: true
    page_context_menu:
      enable: true
      assistant_links: false
    keyboard_nav: true

    # One-click structured feedback; emits gtag events when analytics exists.
    feedback:
      enable: true
      reasons: true

    # Reading time
    reading_time: false
