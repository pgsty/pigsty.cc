#=======================================#
# Basics
#=======================================#
baseURL: https://pigsty.cc/
title: PIGSTY
locale: zh-CN
defaultContentLanguage: zh-cn
enableRobotsTXT: true
enableGitInfo: true
rssLimit: 200
# 标签等列表页标题保留作者原始大小写（不要把 pg_duckdb 渲染成 Pg_duckdb）。
capitalizeListTitles: false

#=======================================#
# Hugo Module (replaces theme: docsy)
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.155.0"
  imports:
    - path: github.com/google/docsy
      disable: false

#=======================================#
# Menu Customization
#=======================================#
menu:
  main:
    - identifier: docs
      name: 文档
      weight: 10
      url: /docs/
      pre: <i class='fa-solid fa-book'></i>
    - identifier: ext
      name: 扩展
      weight: 20
      url: /ext/
      pre: <i class='fa-solid fa-puzzle-piece'></i>

#=======================================#
# Taxonomies Support
#=======================================#
taxonomies:
  module: module          # Pigsty INFRA NODE ETCD PGSQL REDIS MINIO DOCKER APP
  categories: categories  # Overview Concept Arch Config Param Playbook Admin Monitor Dashboard FAQ
  tags: tags              # misc

#=======================================#
# Blog Setting
#=======================================#
permalinks:
  blog: '/:sections/:contentbasename/'

#=======================================#
# External Services, Google Analytics
#=======================================#
services:
  googleAnalytics:
    id: "G-LG1V9WTKGE"

#=======================================#
# Image processing configuration
#=======================================#
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

#=======================================#
# Markdown Configuration
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    # Use class-based Chroma output so Docsy can swap light/dark palettes
    # via CSS instead of baking light-theme colors into the generated HTML.
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS

# Keep ext HTML-only; large catalog outputs can exceed hosting limits.
cascade:
  - target:
      path: '{/ext,/ext/**}'
    outputs:
      - HTML

#=======================================#
# Site Params
#=======================================#
params:
  # metadata
  description: 'Pigsty 是开源免费的 PostgreSQL 数据库发行版，提供本地优先的RDS，以及开箱即用的监控、管控、IaC、高可用，以及PG生态的 562 款插件与12款内核'
  version: 4.4.0
  copyright:
    authors: Ruohang Feng
    from_year: 2018
  privacy_policy: /docs/about/privacy

  # Time format
  time_format_blog: 2006年01月02日
  time_format_default: '2006-01-02'

  # Project info
  archived_version: false
  url_latest_version: 'https://pigsty.cc'
  github_repo: 'https://github.com/pgsty/pigsty.cc'
  github_project_repo: 'https://github.com/pgsty/pigsty'

  # Version dropdown menu
  version_menu: "版本"
  versions:
    - version: "Pigsty English Site"
      url: 'https://pigsty.io'
    - version: "Pigsty v3.7 文档"
      url: 'https://doc.pgsty.com/zh'
    - version: "Pigsty v3.4 文档"
      url: 'https://v34.pigsty.cc/zh'
    - version: "Pigsty v2.7 文档"
      url: 'https://v27.pigsty.cc'
    - version: "Pigsty v1.5 文档"
      url: 'https://v15.pigsty.cc/docs'

  # Taxonomy display settings
  taxonomy:
    taxonomyCloud: [module, categories, tags]
    taxonomyCloudTitle: [模块, 分类, 标签]
    taxonomyPageHeader: [模块, 分类, 标签]

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  # 页面 front matter 可单页覆盖（page_width: wide），栏目可经 cascade 继承。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  footer_icp: 浙ICP备15016890号-2

  # 站内搜索由项目自有的 ⌘K 弹窗实现（lunr 自托管 + /index.json 索引），
  # 必须关闭 Docsy offlineSearch：否则其 offline-search.js 在页面上找不到
  # .td-search input 时会 $.ajax(undefined) 抓当前页 HTML 并抛错。
  offlineSearch: false
  prism_syntax_highlighting: false

  # UI settings
  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    sidebar_menu_compact: true
    sidebar_search_disable: false
    sidebar_menu_foldable: true
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    sidebar_menu_truncate: 2000
    ul_show: 3
    showLightDarkModeMenu: true
    # TOC 高亮由 silo-docs.js 的 IntersectionObserver 实现；Docsy 的
    # Bootstrap ScrollSpy 注入路径存在属性转义 bug，本就从未生效。
    scrollSpy:
      disable: true
    # ---- Fumadocs 式侧栏定制（chrome）----
    # 搜索框下方的根节点下拉：列出所有 sidebar_root_for: self 的 section
    #（文档 / 扩展 / 博客 / Patroni / PgBackRest / PgBouncer）。
    sidebar_root_menu: true
    # 侧栏宽度（px）：默认宽随断点 268/286，可拖拽调整并持久化；
    # min/max 为拖拽钳制范围，可在栏目 front matter 中经 cascade 覆盖。
    sidebar_width_min: 220
    sidebar_width_max: 480
    # 侧栏条目文字溢出策略：ellipsis（省略号，默认）| wrap（换行）。
    sidebar_item_overflow: ellipsis

    # Feedback section (requires Google Analytics)
    feedback:
      enable: true
      "yes": >-
        感谢反馈！请 <a href="https://github.com/pgsty/pigsty/issues/new">告诉我们如何改进</a>。
      "no": >-
        抱歉给您带来不便。请 <a href="https://github.com/pgsty/pigsty/issues/new">告诉我们如何改进</a>。

    # Reading time
    readingtime:
      enable: false

  # Links
  links:
    user:
      - name: 邮件
        url: 'mailto:rh@vonng.com'
        icon: fa fa-envelope
        desc: 发送邮件给作者
      - name: GitHub - Vonng
        url: 'https://github.com/Vonng'
        icon: fab fa-github
        desc: Pigsty code repository
      - name: X - Vonng
        url: 'https://x.com/RonVonng'
        icon: fab fa-x-twitter
        desc: 在 X 上关注老冯
      - name: X - Pigsty
        url: 'https://x.com/PlGSTY'
        icon: fab fa-twitter
        desc: 关注 Twitter 获取最新动态
      - name: LinkedIn - Vonng
        url: 'https://www.linkedin.com/in/vonng/'
        icon: fab fa-linkedin
        desc: 在 LinkedIn 上关注老冯
    developer:
      - name: Discord
        url: 'https://discord.gg/wDzt5VyWEz'
        icon: fab fa-discord
        desc: Discord 频道
      - name: Telegram
        url: 'https://t.me/joinchat/gV9zfZraNPM3YjFh'
        icon: fab fa-telegram
        desc: Telegram 群组
      - name: 微信
        url: /img/pigsty/pigsty-cc.jpg
        icon: fab fa-weixin
        desc: 微信群 & 公众号
      - name: 论坛
        url: 'https://github.com/orgs/pgsty/discussions'
