{{- /* 移动端顶条（fumadocs v16 #nd-subnav 同构）：仅 <md 显示。
       品牌 + 弹性占位 + 搜索钮 + 抽屉钮（右侧抽屉）。sticky top-0、56px、毛玻璃。 */ -}}
<header class="silo-subnav d-md-none d-print-none">
  <a class="silo-subnav__brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }} home">
    {{ with resources.Get "icons/logo.svg" }}{{ (. | minify).Content | safeHTML }}{{ end }}
    <span class="silo-wordmark">{{ .Site.Title }}</span>
  </a>
  <span class="silo-subnav__spacer"></span>
  <button type="button" class="silo-iconbtn silo-subnav__btn" data-silo-search-open
    aria-label="{{ T "ui_search" }}">{{ partialCached "silo/icon.html" "search" "search" }}</button>
  <button type="button" class="silo-iconbtn silo-subnav__btn" data-silo-drawer-open
    title="{{ T "silo_drawer_open" }}" aria-label="{{ T "silo_drawer_open" }}">
    {{- partialCached "silo/icon.html" "panel-left" "panel-left" -}}
  </button>
</header>
